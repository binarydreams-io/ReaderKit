name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  release:
    name: Verify and publish release
    needs: quality
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate the SemVer tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git tag --points-at HEAD | grep -Fxq "$GITHUB_REF_NAME"
          grep -Fq "version: $GITHUB_REF_NAME" CITATION.cff
      - name: Package license notices
        run: |
          bundle="$RUNNER_TEMP/ReaderKit-$GITHUB_REF_NAME-licenses"
          archive="$bundle.zip"
          ./scripts/copy-license-notices.sh "$bundle"
          ditto -c -k --norsrc --noextattr --noqtn --noacl --keepParent "$bundle" "$archive"
          (
            cd "$RUNNER_TEMP"
            shasum -a 256 "$(basename "$archive")" > "$(basename "$archive").sha256"
          )
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
          --title "ReaderKit $GITHUB_REF_NAME"
          "$RUNNER_TEMP/ReaderKit-$GITHUB_REF_NAME-licenses.zip"
          "$RUNNER_TEMP/ReaderKit-$GITHUB_REF_NAME-licenses.zip.sha256"
